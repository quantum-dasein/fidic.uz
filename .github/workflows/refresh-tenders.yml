name: Refresh tender snapshot

# The /tenders/ page is rendered statically so it is indexable, which means the
# data is only as fresh as the last commit. This refetches the World Bank
# procurement snapshot and commits it if anything changed; the commit triggers
# the normal Vercel deploy.
#
# Run it by hand any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    # 06:15 UTC daily. Off the hour on purpose: scheduled jobs at :00 queue
    # behind everyone else's cron and get delayed.
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tenders
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch tender snapshot
        run: node scripts/fetch-tenders.mjs

      - name: Commit if the snapshot changed
        id: commit
        run: |
          if git diff --quiet -- src/data/tenders.json; then
            echo "No change in the snapshot; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tenders.json
          open=$(node -e "process.stdout.write(String(require('./src/data/tenders.json').counts.open))")
          total=$(node -e "process.stdout.write(String(require('./src/data/tenders.json').counts.total))")
          git commit -m "chore(tenders): refresh snapshot — ${open} open of ${total} works notices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The tender pages are the URLs on this site whose content genuinely
      # changes on a schedule, so they are the ones worth pinging. Waiting lets
      # the Vercel deploy triggered by the commit above finish first —
      # announcing a URL before the new content is live just gets the old page
      # recrawled.
      #
      # `--match` picks the tender URLs out of the freshly built sitemap, so the
      # per-country pages are announced without this file keeping its own copy
      # of the country-slug list — countries come and go with the data.
      - name: Build so the sitemap lists the pages to announce
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Tell IndexNow the tender pages changed
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 120
          node scripts/indexnow.mjs --match /tenders/
        continue-on-error: true
